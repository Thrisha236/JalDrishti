# One command: docker compose up --build        (copy .env.example to .env first and set the secrets)
# Starts PostgreSQL, the API and the web app on http://localhost:8080.
# NOTE: these files have not been run in the environment where they were written (no Docker was installed there).
# Treat the first run as a test, and read docs/DEPLOYMENT.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jalrakshak
      POSTGRES_USER: jalrakshak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jalrakshak -d jalrakshak"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      JALRAKSHAK_ENV: ${JALRAKSHAK_ENV:-production}
      JALRAKSHAK_DB: postgresql+psycopg://jalrakshak:${POSTGRES_PASSWORD}@db:5432/jalrakshak
      JALRAKSHAK_SECRET: ${JALRAKSHAK_SECRET:?set JALRAKSHAK_SECRET in .env}
      JALRAKSHAK_DEMO: ${JALRAKSHAK_DEMO:-0}
      JALRAKSHAK_DEMO_PASSWORD: ${JALRAKSHAK_DEMO_PASSWORD:?set JALRAKSHAK_DEMO_PASSWORD in .env}
      JALRAKSHAK_DEVICE_KEYS: ${JALRAKSHAK_DEVICE_KEYS:?set JALRAKSHAK_DEVICE_KEYS in .env}
      JALRAKSHAK_LOAD_SEED: ${JALRAKSHAK_LOAD_SEED:-1}
      JALRAKSHAK_TRUST_PROXY: "1"
      JALRAKSHAK_CORS: ${JALRAKSHAK_CORS:-http://localhost:8080}
      JALRAKSHAK_READINGS_RETENTION_DAYS: ${JALRAKSHAK_READINGS_RETENTION_DAYS:-30}
    volumes:
      - uploads:/data/uploads

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  dbdata:
  uploads:
